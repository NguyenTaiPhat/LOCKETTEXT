<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOCKET • Điều bất ngờ dành cho em</title>
  <meta name="description" content="Một thông điệp yêu thương đặc biệt gửi đến em từ Locket">
  <link rel="icon" type="image/png" href="assets/locket-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #141417;
      --card-border: rgba(255, 196, 0, 0.38);
      --card-glow: rgba(255, 196, 0, 0.14);
      --gold-primary: #FFB800;
      --gold-light: #FFC400;
      --gold-deep: #FFAE00;
      --text-main: #FFFFFF;
      --text-muted: #8E8E98;
      --text-sub: #6E6E78;
      --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .glow-orb {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 196, 0, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(50px);
    }
    .glow-orb.top { top: -80px; left: 50%; transform: translateX(-50%); }
    .glow-orb.bottom { bottom: -100px; left: 50%; transform: translateX(-50%); }

    /* Canvas for floating subtle hearts */
    #heartsCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Wrapper */
    .gift-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: modalFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Main Modal Card (Identical to Image 1) */
    .gift-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 22px 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 35px var(--card-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Top Yellow Dash Handle */
    .card-handle-bar {
      width: 44px;
      height: 4.5px;
      border-radius: 4px;
      background: var(--gold-light);
      margin: 0 auto 16px;
      flex-shrink: 0;
    }

    /* Yellow Audio Badge Button (Image 1 top element) */
    .locket-audio-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 8px;
      transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
      position: relative;
    }

    .locket-audio-btn.has-music {
      cursor: pointer;
      opacity: 1;
    }

    .locket-audio-btn.has-music:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 10px rgba(255, 184, 0, 0.5));
    }

    .locket-audio-btn.has-music:active {
      transform: scale(0.96);
    }

    .locket-audio-btn.no-music {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    .locket-icon-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(255, 184, 0, 0.45);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .locket-audio-btn.playing .locket-icon-badge {
      animation: heartPulse 1.2s infinite ease-in-out;
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 14px rgba(255, 184, 0, 0.45); }
      50% { transform: scale(1.14); box-shadow: 0 0 22px rgba(255, 184, 0, 0.8); }
    }

    .heart-svg {
      width: 16px;
      height: 16px;
      fill: #7D4800;
      transition: fill 0.2s ease;
    }

    .locket-btn-text {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    /* Wave bars indicator for playing music */
    .audio-wave-bars {
      display: none;
      align-items: flex-end;
      gap: 2.5px;
      height: 13px;
      margin-left: 2px;
    }

    .locket-audio-btn.playing .audio-wave-bars {
      display: flex;
    }

    .audio-wave-bars span {
      width: 2.5px;
      background: var(--gold-primary);
      border-radius: 2px;
      animation: soundWave 0.8s infinite ease-in-out alternate;
    }
    .audio-wave-bars span:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .audio-wave-bars span:nth-child(2) { height: 12px; animation-delay: 0.3s; }
    .audio-wave-bars span:nth-child(3) { height: 8px; animation-delay: 0.2s; }

    @keyframes soundWave {
      0% { height: 4px; }
      100% { height: 13px; }
    }

    /* Photo Container (Displayed ONLY if image is present) */
    .photo-container {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px auto 14px;
      border: 1.5px solid rgba(255, 196, 0, 0.35);
      position: relative;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: none; /* Only shown if image is uploaded */
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--pos-x, 50%) var(--pos-y, 50%);
      transform: scale(var(--zoom, 1));
      transform-origin: var(--pos-x, 50%) var(--pos-y, 50%);
      display: block;
      transition: transform 0.2s ease;
    }

    /* Title (hehee in Image 1) */
    .gift-title {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      margin: 12px 0 6px;
      letter-spacing: -0.3px;
      line-height: 1.25;
      word-break: break-word;
    }

    /* Subtitle / Message (moah in Image 1 - clean text, NO box) */
    .gift-message {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-muted);
      margin: 0 0 22px;
      font-weight: 500;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* CTA Pill Button (Image 2 yellow button) */
    .gift-action-btn {
      width: 100%;
      height: 52px;
      background: #FFC400;
      background: linear-gradient(180deg, #FFD600 0%, #FFAE00 100%);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #000000 !important;
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(255, 196, 0, 0.55);
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .gift-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 196, 0, 0.65);
    }

    .gift-action-btn:active {
      transform: scale(0.98);
    }

    .btn-chevron {
      stroke: #000000 !important;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin="round";
    }

    /* Dismiss Button (Đóng lại in Image 1) */
    .gift-dismiss-btn {
      color: var(--text-sub);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      border: none;
      cursor: pointer;
      margin-top: 14px;
      display: block;
      width: 100%;
      padding: 6px;
      transition: color 0.2s ease;
    }

    .gift-dismiss-btn:hover {
      color: var(--text-muted);
    }

    /* Inactive State Box */
    .inactive-card {
      padding: 40px 16px;
    }
    .inactive-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      fill: none;
      stroke: var(--gold-primary);
      stroke-width: 1.5;
    }
    .inactive-card h2 {
      font-family: var(--font-heading);
      font-size: 18px;
      margin-bottom: 8px;
    }
    .inactive-card p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Loading Spinner */
    .loading-spinner {
      padding: 50px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .spinner-svg {
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="glow-orb top"></div>
  <div class="glow-orb bottom"></div>
  <canvas id="heartsCanvas"></canvas>

  <div class="gift-wrapper">
    <main class="gift-card" id="giftCard">
      <!-- Loading State -->
      <div id="loadingState" class="loading-spinner">
        <svg class="spinner-svg" viewBox="0 0 24 24" stroke="#FFC400" stroke-width="2.5" fill="none">
          <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-linecap="round"/>
        </svg>
        <p style="font-size: 13px; color: var(--text-muted);">Đang mở hộp quà...</p>
      </div>

      <!-- Active Content Container (Matches Image 1) -->
      <div id="contentContainer" style="display: none; width: 100%;">
        <!-- Top Yellow Dash Handle -->
        <div class="card-handle-bar"></div>

        <!-- Yellow Audio Badge Button (Image 1) -->
        <button type="button" class="locket-audio-btn no-music" id="locketAudioBtn" title="Bấm để nghe nhạc" disabled>
          <span class="locket-icon-badge">
            <svg class="heart-svg" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </span>
          <span class="locket-btn-text">LOCKET</span>
          <span class="audio-wave-bars" id="audioWaveBars">
            <span></span><span></span><span></span>
          </span>
        </button>

        <!-- Optional Photo Box (Only if image uploaded) -->
        <div class="photo-container" id="photoBox">
          <img id="giftImage" src="" alt="Ảnh kỷ niệm">
        </div>

        <!-- Title -->
        <h1 class="gift-title" id="giftTitle">hehee</h1>

        <!-- Subtitle / Message (moah) -->
        <p class="gift-message" id="giftMessage">moah</p>

        <!-- Action Button (yêu >) -->
        <a id="giftBtn" href="#" class="gift-action-btn" target="_blank" rel="noopener noreferrer">
          <span id="giftBtnText">yêu</span>
          <svg class="btn-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>

        <!-- Dismiss Button (Đóng lại) -->
        <button type="button" class="gift-dismiss-btn" id="giftDismissBtn">Đóng lại</button>
      </div>

      <!-- Inactive State Container -->
      <div id="inactiveContainer" class="inactive-card" style="display: none;">
        <svg class="inactive-icon" viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <h2>Hộp quà đang chuẩn bị</h2>
        <p>Anh người yêu đang chuẩn bị điều bất ngờ cho em.<br>Hãy quay lại sau nhé! ✨</p>
      </div>
    </main>

    <!-- Hidden audio element for music playback -->
    <audio id="giftAudio" preload="auto" loop></audio>
  </div>

  <script>
    // Floating Hearts Canvas
    (function initCanvas() {
      const canvas = document.getElementById('heartsCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const particleCount = 20;

      class Heart {
        constructor() { this.reset(true); }
        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 20;
          this.size = Math.random() * 10 + 7;
          this.speedY = Math.random() * 0.8 + 0.4;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.3 + 0.12;
          this.color = Math.random() > 0.4 ? 'rgba(255, 196, 0, ' : 'rgba(255, 94, 126, ';
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.02;
        }
        update() {
          this.y -= this.speedY;
          this.x += this.speedX;
          this.rotation += this.rotSpeed;
          if (this.y < -30 || this.x < -30 || this.x > width + 30) this.reset(false);
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.scale(this.size / 24, this.size / 24);
          ctx.fillStyle = this.color + this.opacity + ')';
          ctx.beginPath();
          ctx.moveTo(0, -6);
          ctx.bezierCurveTo(-10, -18, -20, -5, -20, 6);
          ctx.bezierCurveTo(-20, 16, -10, 24, 0, 32);
          ctx.bezierCurveTo(10, 24, 20, 16, 20, 6);
          ctx.bezierCurveTo(20, -5, 10, -18, 0, -6);
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < particleCount; i++) particles.push(new Heart());

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // Gift Logic
    const loadingState = document.getElementById('loadingState');
    const contentContainer = document.getElementById('contentContainer');
    const inactiveContainer = document.getElementById('inactiveContainer');
    const locketAudioBtn = document.getElementById('locketAudioBtn');
    const giftTitle = document.getElementById('giftTitle');
    const giftMessage = document.getElementById('giftMessage');
    const giftImage = document.getElementById('giftImage');
    const photoBox = document.getElementById('photoBox');
    const giftBtn = document.getElementById('giftBtn');
    const giftBtnText = document.getElementById('giftBtnText');
    const giftDismissBtn = document.getElementById('giftDismissBtn');
    const giftAudio = document.getElementById('giftAudio');

    let isPlaying = false;

    // Toggle music playback via the yellow [💛 LOCKET] button
    locketAudioBtn.addEventListener('click', toggleMusic);

    function toggleMusic() {
      if (!giftAudio.src) return;
      if (isPlaying) {
        giftAudio.pause();
        isPlaying = false;
        locketAudioBtn.classList.remove('playing');
      } else {
        giftAudio.play().then(() => {
          isPlaying = true;
          locketAudioBtn.classList.add('playing');
        }).catch(err => {
          console.warn('Playback error:', err);
        });
      }
    }

    giftAudio.addEventListener('ended', () => {
      isPlaying = false;
      locketAudioBtn.classList.remove('playing');
    });

    // Dismiss button behavior
    giftDismissBtn.addEventListener('click', () => {
      const card = document.getElementById('giftCard');
      card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
      card.style.opacity = '0';
      card.style.transform = 'scale(0.9)';
      setTimeout(() => {
        card.style.opacity = '1';
        card.style.transform = 'scale(1)';
      }, 1500);
    });

    async function loadGift() {
      try {
        const res = await fetch('/api/message', { cache: 'no-store' });
        if (!res.ok) throw new Error('API status ' + res.status);
        const data = await res.json();

        loadingState.style.display = 'none';

        if (data.active) {
          contentContainer.style.display = 'block';
          inactiveContainer.style.display = 'none';

          // Title & Message
          giftTitle.textContent = data.title || 'hehee';
          giftMessage.textContent = data.message || 'moah';

          // Image alignment & display
          if (data.image_url) {
            giftImage.src = data.image_url;
            photoBox.style.display = 'block';
            const posX = typeof data.image_x === 'number' ? data.image_x : 50;
            const posY = typeof data.image_y === 'number' ? data.image_y : 50;
            const zoom = typeof data.image_zoom === 'number' ? data.image_zoom : 1;
            giftImage.style.setProperty('--pos-x', `${posX}%`);
            giftImage.style.setProperty('--pos-y', `${posY}%`);
            giftImage.style.setProperty('--zoom', `${zoom}`);
          } else {
            photoBox.style.display = 'none';
          }

          // Music playback via yellow button
          if (data.music_url) {
            giftAudio.src = data.music_url;
            locketAudioBtn.disabled = false;
            locketAudioBtn.classList.remove('no-music');
            locketAudioBtn.classList.add('has-music');
            locketAudioBtn.title = 'Bấm để nghe nhạc';

            // Attempt autoplay
            giftAudio.play().then(() => {
              isPlaying = true;
              locketAudioBtn.classList.add('playing');
            }).catch(() => {
              // Wait for user gesture on button
            });
          } else {
            giftAudio.pause();
            giftAudio.src = '';
            locketAudioBtn.disabled = true;
            locketAudioBtn.classList.remove('has-music', 'playing');
            locketAudioBtn.classList.add('no-music');
            locketAudioBtn.title = 'Chưa có nhạc';
          }

          // CTA Button
          giftBtnText.textContent = data.btn_text || 'yêu';
          giftBtn.href = data.btn_link || 'https://m.me/';
        } else {
          contentContainer.style.display = 'none';
          inactiveContainer.style.display = 'block';
        }
      } catch (err) {
        console.error('Failed to load gift:', err);
        loadingState.style.display = 'none';
        inactiveContainer.style.display = 'block';
      }
    }

    loadGift();
    setInterval(loadGift, 15000);
  </script>
</body>
</html>
